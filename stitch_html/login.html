<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom ghost input styling based on guidance */
        .ghost-input {
            background-color: transparent;
            border: 1px solid #F8BBD0; /* secondary-container-ish for un-focused */
            transition: all 0.2s ease-in-out;
        }
        .ghost-input:focus {
            border-color: #880E4F; /* primary-container */
            border-width: 2px;
            outline: none;
            box-shadow: none;
        }
    </style>

<body class="bg-surface min-h-screen flex items-center justify-center p-margin_mobile md:p-margin_desktop font-body-md text-on-surface">
<main class="w-full max-w-md">
<!-- Logo Header -->
<div class="text-center mb-8">
<img alt="PinkPulse AI Logo" class="h-24 mx-auto mb-4 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRyshHQE_muzcYhulg84zUege6Wl-7k4A_N3c8AlhiE2RMWtKoXdiLUQ3LuJjy3EVBvWeS4avWZaT4ykrb64R9sMECy2JuEjfPX97WYwLo9UkRpPWVV8zGKZoRNT3tqpiJvR5E7jiVvpzpeEY6xtdLuy5mHQiCcimxZSPMVIW_ilAAInp-SVgw-D4yk8490G9EhcTWr_rQ5ZYsA45Mtcdl0SJhnagl_Ps6tJ3FXq0pafy4vQn3FC-Ed0NFXx0CEuj1jnjSqVQIPKds">
<h1 class="font-headline-md text-headline-md text-primary">PinkPulse AI</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2"><br></p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-card shadow-soft-pink p-8">
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-6">
<button class="flex-1 pb-3 text-center font-label-md text-label-md text-primary border-b-2 border-primary transition-colors" id="tab-login" onclick="switchTab('login')">
                    Login
                </button>
<button class="flex-1 pb-3 text-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" id="tab-signup" onclick="switchTab('signup')">
                    Sign Up
                </button>
</div>
<!-- Login Form -->
<form class="space-y-6" id="form-login">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="login-email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="ghost-input w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface" id="login-email" placeholder="doctor@hospital.org" required="" type="email">
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="login-password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="ghost-input w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface" id="login-password" placeholder="••••••••" required="" type="password">
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary transition-colors shadow-soft-pink hover:shadow-float" type="submit">
                    Login
                </button>
</form>
<!-- Sign Up Form (Hidden by default) -->
<form class="space-y-6 hidden" id="form-signup">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="signup-name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="ghost-input w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface" id="signup-name" placeholder="Dr. Jane Doe" type="text">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="signup-email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="ghost-input w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface" id="signup-email" placeholder="doctor@hospital.org" type="email">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="signup-password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="ghost-input w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface" id="signup-password" placeholder="Create a strong password" type="password">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="signup-confirm">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="ghost-input w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface" id="signup-confirm" placeholder="Confirm your password" type="password">
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary transition-colors shadow-soft-pink hover:shadow-float" type="button">
                    Sign Up
                </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-4">
                    By signing up, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                </p>
</form>
</div>
</main>
<script>
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');

            if (tab === 'login') {
                // Active Login
                loginTab.classList.add('text-primary', 'border-b-2', 'border-primary');
                loginTab.classList.remove('text-on-surface-variant', 'border-transparent');
                
                // Inactive Signup
                signupTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
                signupTab.classList.add('text-on-surface-variant');
                signupTab.style.borderBottom = 'none'; // reset

                // Toggle Forms
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                // Active Signup
                signupTab.classList.add('text-primary', 'border-b-2', 'border-primary');
                signupTab.classList.remove('text-on-surface-variant', 'border-transparent');
                
                // Inactive Login
                loginTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
                loginTab.classList.add('text-on-surface-variant');
                loginTab.style.borderBottom = 'none';

                // Toggle Forms
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }
    </script>
